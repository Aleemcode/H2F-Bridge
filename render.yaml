services:
  - type: web
    name: html-to-figma-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BACKEND_URL
        value: "https://html-to-figma-backend-qrnq.onrender.com"
      - key: CAPTURE_RETENTION_HOURS
        value: "168"
